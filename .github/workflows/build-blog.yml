name: Build Blog

on:
  push:
    paths:
      - 'blog/_posts/**'
      - '.github/scripts/build-blog.mjs'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install gray-matter marked

      - name: Build blog HTML
        run: node .github/scripts/build-blog.mjs

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build blog HTML from markdown sources"
          file_pattern: "blog.html blog/*.html"

      - name: Deploy blog to GoDaddy via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          put -O / blog.html
          mkdir -p /blog
          mput -O /blog blog/*.html
          bye
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
